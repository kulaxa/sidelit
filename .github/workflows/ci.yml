name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Check syntax and versions
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile sidelit/*.py sidelit/core/*.py plugin/hooks/*.py
      # the engine against a fake desktop: logout cascades, unplugged screens, login restores
      - run: python -m unittest discover -s tests -v
      # (one file per `sh -n`: it reads only its first argument as the script)
      - run: for f in bin/sidelit bin/sidelit-open bin/sidelit-hook bin/sidelit-chrome-host debian/sidelit.postrm; do sh -n "$f"; done
      - run: python -m json.tool chrome-extension/manifest.json > /dev/null
      - run: python -m json.tool gnome-extension/metadata.json > /dev/null
      - run: for f in get.sh install.sh uninstall.sh package.sh PKGBUILD sidelit.install; do bash -n "$f"; done
      - run: test "$(cat VERSION)" = "$(grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)"
      - run: test "$(cat VERSION)" = "$(sed -n 's/^pkgver=//p' PKGBUILD)"
      - run: test "$(cat VERSION)" = "$(python -c 'import json; print(json.load(open("chrome-extension/manifest.json"))["version"])')"
      - run: test "$(cat VERSION)" = "$(python -c 'import json; print(json.load(open("plugin/.claude-plugin/plugin.json"))["version"])')"

  plugin:
    name: Check the Claude Code plugin
    runs-on: ubuntu-latest
    container: node:22-slim
    steps:
      - uses: actions/checkout@v4
      # Claude Code's own checks of the marketplace, the plugin and its hooks module, and the
      # usage mod's tests (plugin/tests); none of them needs a login
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate plugin
      - run: claude plugin test plugin

  # the slim image has no PyGObject: the tests that need GLib and a bus run here, among them the
  # KDE and GNOME backends against a fake KWin and a fake GNOME Shell on a private session bus
  # (and, with the runner's Node, whether the GNOME Shell extension's JavaScript parses)
  test-glib:
    name: Tests with GLib and D-Bus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-gi dbus-daemon
      - run: python3 -m unittest discover -s tests -v

  # The one-line install (get.sh) on a fresh system of each distribution it knows, as a user with
  # sudo, cloning this checkout: the packages, the clone, install.sh, the start (which goes
  # nowhere here: no desktop). Then again with sudo taken away: a second run must not need it.
  installer:
    name: One-line install on ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:trixie', 'fedora:latest', 'archlinux:latest', 'opensuse/tumbleweed:latest']
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck get.sh install.sh uninstall.sh
      # (a pull request is checked out on no branch, and the second run pulls one)
      - run: git checkout -B installer-test
      - run: |
          docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" bash -euc '
            if command -v apt-get >/dev/null; then apt-get update -q && apt-get install -y -q sudo
            elif command -v dnf >/dev/null; then dnf install -y -q sudo shadow-utils
            elif command -v pacman >/dev/null; then pacman -Syu --noconfirm --needed sudo
            else zypper -n install sudo shadow
            fi
            useradd -m tester
            echo "tester ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/tester
            # no systemd user manager runs in a container: a systemctl that fails sends Sidelit
            # down its path without one, as on a system without systemd
            ln -s /bin/false /usr/local/bin/systemctl
            # the checkout to clone, owned by the tester (git refuses a checkout of another user)
            cp -r /src /srv/sidelit
            chown -R tester: /srv/sidelit
            as_tester() {
              sudo -u tester env HOME=/home/tester PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin \
                XDG_CURRENT_DESKTOP=KDE XDG_SESSION_TYPE=wayland SIDELIT_REPO=/srv/sidelit \
                bash -c "cd && cat /src/get.sh | bash" || { cat /home/tester/.cache/sidelit-install.log; exit 1; }
            }
            as_tester
            test -L /home/tester/.local/bin/sidelit
            test -f /home/tester/.config/autostart/sidelit.desktop
            # the GTK 4 sidebar where the distribution has gtk4-layer-shell (all but Ubuntu 24.04)
            if [ "${{ matrix.image }}" != ubuntu:24.04 ]; then
              cd /home/tester/.local/share/sidelit
              python3 -c "from sidelit import sidebar4; raise SystemExit(sidebar4.layer_shell_paths() is None)"
              cd /
            fi
            rm /etc/sudoers.d/tester
            as_tester
          '

  package:
    name: Build the .deb
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      # the image is debian, so this exercises the dpkg-deb path of package.sh
      - run: ./package.sh deb
      - run: dpkg-deb --info dist/*.deb && dpkg-deb --contents dist/*.deb
      - run: dpkg-deb --contents dist/*.deb | grep -q 'gnome-shell/extensions/sidelit@kulaxa.github.io/metadata.json'
      # the GNOME Shell extension as extensions.gnome.org takes an upload
      - run: ./package.sh gnome-extension && python -m zipfile -l dist/*.shell-extension.zip
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: |
            dist/*.deb
            dist/*.shell-extension.zip

  arch:
    name: Build the Arch package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      # makepkg checks that the dependencies exist and are installed, and will not run as root
      - run: pacman -Syu --noconfirm --needed base-devel python python-gobject gtk3 gtk-layer-shell systemd
      - run: |
          useradd -m builder
          chown -R builder .
          su builder -c './package.sh arch'
      - run: pacman -Qip dist/*.pkg.tar.zst && pacman -Qlp dist/*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  # Bumping VERSION on main is what publishes: reuses the packages built above and cuts the
  # matching v<version> release. Does nothing when that version is already released.
  release:
    name: Publish release
    needs: [test, test-glib, package, arch]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"; exit 0
          fi
          # release notes: the top CHANGELOG.md entry, without its heading
          awk '/^## /{n++} n==1 && !/^## /' CHANGELOG.md > notes.md
          # fixed names for the README's install lines and the update button
          cp dist/*.deb dist/sidelit_latest_all.deb
          cp dist/*.pkg.tar.zst dist/sidelit-latest-any.pkg.tar.zst
          echo "$version" > dist/sidelit_latest_version.txt
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file notes.md --latest \
            dist/*.deb dist/*.pkg.tar.zst dist/*.shell-extension.zip dist/sidelit_latest_version.txt
